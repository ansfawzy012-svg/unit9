<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="index.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anas</title>

<body>
    <nav>
        <a href="login/login.html">login</a>
        <a href="register/rogister.html">rogister</a>
    </nav>
    <section>
        <form action="../register/rogister.html">
            <table border="0">
                <tr>
                    <td>
                        <label for="name">name:</label>
                    </td>
                    <td>
                        <input type="text" id="name" placeholder="name" required>
                    </td>


                </tr>
                <tr>
                    <td>
                        <label for="password">password:</label>
                    </td>
                    <td>
                        <input type="password" id="password" placeholder="*****" required>
                    </td>
                </tr>

                <tr>

                    <td><label for="email">email:</label></td>
                    <td>
                        <input type="email" id="email" placeholder="@gmail.com" required>
                    </td>

                </tr>
                <tr>
                    <td><label for="male">male:</label></td>
                    <td> <input type="checkbox" id="male" name="m" required></td>
               
               
                    <td>
                        <label for="female">female:</label>

                    </td>
                    <td><input type="checkbox" name="m" id="female" required></td>
                 </tr>
                 <tr>
                    <td></td>
                    <td><button style="padding: 5px;background-color: cadetblue;border-radius: 10px;border: none;">submit</button></td>
                </tr>

            </table>
        </form>
    </section>
    

</body>

</html>
